name: Publish guide to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check cities.js && node --check app.js && node --check data.js && node --check world.js && node --check professions.js && node --check dungeons.js && node --check details.js && node --check player-guides.js && node --check raid-planner.js && node --check auction-house.js && node --check calculators.js && node --check player-ui.js && node --check dungeon-runs.js && node --check lore-more.js && node --check lore.js && node --check research.js && node --check scenes.js && node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static output
        run: |
          mkdir _site
          cp index.html cities.js app.js data.js world.js professions.js dungeons.js details.js research.js lore.js lore-more.js dungeon-runs.js player-guides.js calculators.js player-ui.js auction-house.js raid-planner.js scenes.js style.css areas.css compass.svg landscape.svg _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
